# Which tools a client is shown, by the kind of question (config: `tool_profile`). `core` is
# always shown; a profile adds the tools its kind of study is carried out with. Every other
# registered tool stays one `tool_lookup` and `tool_run` away. `tool_profile = "all"` shows
# every tool whose engines this machine has.
core: [study_open, study_create, file_read, file_write, file_check, doctor, skill_lookup,
       tool_lookup, knowledge_search, inputset_lookup, inputset_apply, protocol_lookup,
       protocol_preview, mandate_write, mandate_show, job_status, job_cancel, journal_write,
       script_run, study_report]
prep: [fetch_pdb, lookup, structure_select, ligand_parametrize, complex_assemble, gmx_pdb2gmx,
       gmx_editconf, gmx_solvate, gmx_genion, gmx_make_ndx, gmx_genrestr]
md: [fetch_pdb, structure_select, ligand_parametrize, complex_assemble, gmx_pdb2gmx,
       gmx_editconf, gmx_solvate, gmx_genion, gmx_make_ndx, gmx_genrestr, gmx_grompp,
       gmx_mdrun, checkpoint_continue, observable_measure]
qmmm: [gmx_grompp, gmx_make_ndx, qm_region, mimic_prepare, mimic_run, run_diagnose,
       observable_measure]
fm: [snapshot_select, dataset_collect, qm_region, mimic_prepare, mimic_run, run_diagnose,
       fm_plan, fm_fit, gmx_grompp, gmx_rerun, gmx_minimize_frames, observable_measure,
       study_report]
analysis: [observable_measure, snapshot_select, viz_open, viz_command, session_summary]
