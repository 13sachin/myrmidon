id: cpmd.mimic
engine: cpmd
renders: cpmd_inp
reads: qm
title: How CPMD computes and couples a MiMiC QM region
applicability: The keys every coupled CPMD stage shares, read from the QM method and the
  coupling; never rendered alone. &MIMIC PATHS, BOX, OVERLAPS and &ATOMS are the system's,
  written by mimicpy's prepqm.
parameters:
  '&CPMD/MIMIC': {value: true, source: 0}
  '&CPMD/NEW CONSTRAINTS': {value: true, source: 0}
  '&CPMD/ISOLATED MOLECULE': {value: true, rationale: the QM cell is not periodic, source: 0}
  '&MIMIC/LONG-RANGE COUPLING': {value: true, source: 0}
  '&MIMIC/MULTIPOLE ORDER': {from_method: multipole_order, of: coupling}
  '&MIMIC/CUTOFF DISTANCE': {from_method: cutoff_bohr, of: coupling}
  '&MIMIC/FRAGMENT SORTING ATOM-WISE UPDATE': {from_method: sorting_update_steps, of: coupling}
  '&SYSTEM/SYMMETRY': {value: 0, source: 0}
  '&SYSTEM/POISSON SOLVER TUCKERMAN': {value: true, source: 0}
  '&SYSTEM/CUTOFF': {from_method: cutoff_ry}
  '&SYSTEM/CHARGE': {from_stage: qm_region.charge, required: true}
  '&SYSTEM/MULTIPLICITY': {from_stage: qm_region.multiplicity, when: {open_shell: true}}
  '&CPMD/LSD':
    by_stage: open_shell
    map: {'True': true}
    rationale: an open-shell region is computed spin-polarised
    source: 0
  '&DFT/XC_DRIVER': {value: true, rationale: 'libxc names the functional', source: 0}
  '&DFT/FUNCTIONAL': {from_method: functional, in_key: true}
sources:
- kind: url
  text: MiMiC documentation, the CPMD input of a coupled run.
  locator: https://mimic-project.org/en/latest/tutorials/acetone_tutorial.html
pitfalls: [QM_ELEMENT_NOT_COVERED]
version: 1
