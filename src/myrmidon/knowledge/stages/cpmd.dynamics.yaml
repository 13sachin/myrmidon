id: cpmd.dynamics
extends: cpmd.mimic
engine: cpmd
renders: cpmd_inp
reads: qm
kinds: [dynamics]
regimes: [qmmm]
ensembles: [NVE, NVT]
title: Born-Oppenheimer QM/MM dynamics in the stage's ensemble
applicability: Any coupled dynamics stage continuing an earlier one — an NVE stability check,
  a heating ramp, constant-temperature production — its thermostat chosen by the stage's
  ensemble and temperature.
pricing: {throughput: s_per_step}
# a Berendsen thermostat trails a moving target by about rate × τ, and the temperature a log
# reports relaxes slower still, as part of each kinetic energy injected goes into potential
# energy (2–3 τ in coupled acetone-in-water runs): held 10 τ, the ions reach the target
ramp_hold_au: 5000
parameters:
  '&CPMD/RESTART COORDINATES VELOCITIES WAVEFUNCTION':
    value: true
    when: {fresh_start: false}
    rationale: a dynamics stage continues the run it starts from; a run that left no
      wavefunction to read (a classical stage before the first coupled one) starts fresh
    source: 0
  '&CPMD/MOLECULAR DYNAMICS BO': {value: true, source: 0}
  '&CPMD/TIMESTEP': {from_method: timestep_au}
  '&CPMD/CONVERGENCE ORBITALS':
    value: 1.0e-6
    when: {thermostat: none}
    rationale: an NVE stage is read for the conserved energy's drift, and Born-Oppenheimer
      steps converged to CPMD's default 1e-5 can scatter its slope by the order of 1e-3 Ha/ps
      over a sub-ps run of a small solvated QM region; 1e-6 is expected to bring that scatter
      well under a drift check's threshold, at one to three more SCF iterations a step
    source: 1
  '&CPMD/MAXSTEP': {from_stage: steps, required: true}
  '&CPMD/TEMPERATURE RAMP':
    from_stage: temperature_ramp
    required: true
    when: {thermostat: ramp}
    rationale: from the temperature the earlier stage ended at to the target, at the ramp's rate
  '&CPMD/BERENDSEN IONS':
    from_stage: ramp_start_k
    with: [500]
    required: true
    when: {thermostat: ramp}
    rationale: a.u. coupling time τ of the Berendsen thermostat that carries the ramp, a
      harness choice over the tutorial's 5000 a.u. — a thermostat trails a ramp by about rate
      × τ, longer with the potential energy's share, and 5000 a.u. leaves a 1500-step heating
      tens of K short; 500 a.u. (50 steps of 10 a.u.) is well inside Berendsen's stability
  '&CPMD/NOSE IONS':
    from_stage: temperature_k
    with: [4000]
    when: {thermostat: constant}
    rationale: cm^-1, the Nose-Hoover thermostat's frequency
    source: 0
  '&CPMD/DIPOLE DYNAMICS': {by_stage: thermostat, map: {constant: true}, source: 0}
  '&CPMD/TRAJECTORY SAMPLE': {from_stage: sampling_steps}
  '&CPMD/STORE': {from_stage: sampling_steps}
  '&CPMD/RESTFILE': {value: 1, source: 0}
sources:
- kind: url
  text: MiMiC documentation — NVE check, heating and Nose-Hoover production of a coupled system.
  locator: https://mimic-project.org/en/latest/tutorials/acetone_tutorial.html
- kind: url
  text: CPMD 4.3 manual — CONVERGENCE ORBITALS, the wavefunction gradient each step converges to.
  locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex#cpmd-convergence
version: 2
