id: protein_ligand_complex_in_water
system_class: >-
  one protein chain with one small-molecule ligand from a deposited structure, an Amber-family protein
  force field with a GAFF-family ligand and TIP3P water
title: >-
  Protein–ligand complex in water — select, parametrise, assemble, equilibrate under restraints, produce
scope: engine
applicability: >-
  An assembled protein–ligand complex in water, minimised, then NVT and NPT with protein and ligand
  restrained and the ligand in the protein's heat bath, then unrestrained production. A starting point,
  not a rule: a second ligand or a membrane is a different sequence.
given:
- structure
- topology
- index
stages:
- name: em
  kind: minimize
- name: nvt
  kind: dynamics
  ensemble: NVT
  temperature_k: 300
  duration_ps: 100
  restraints:
  - protein
  - ligand
- name: npt
  kind: dynamics
  ensemble: NPT
  temperature_k: 300
  pressure_bar: 1
  duration_ps: 100
  restraints:
  - protein
  - ligand
- name: production
  kind: dynamics
  ensemble: NPT
  temperature_k: 300
  pressure_bar: 1
  duration_ps: 1000
  sampling_ps: 10
sources:
- kind: tutorial
  text: >-
    Lemkul, "Protein-Ligand Complex" GROMACS tutorial — T4 lysozyme L99A with 2-propylphenol (PDB
    3HTB); the sequence of selection, ligand topology, assembly, restrained NVT and NPT with the ligand
    coupled to the protein, and production.
  locator: http://www.mdtutorials.com/gmx/complex/
- kind: doi
  text: >-
    Sousa da Silva, Vranken, BMC Res. Notes 5, 367 (2012) — ACPYPE, AnteChamber PYthon Parser interfacE.
    doi:10.1186/1756-0500-5-367
  locator: doi:10.1186/1756-0500-5-367
- kind: doi
  text: >-
    Jakalian, Jack, Bayly, J. Comput. Chem. 23, 1623 (2002) — fast, efficient generation of high-quality
    atomic charges, AM1-BCC model. doi:10.1002/jcc.10128
  locator: doi:10.1002/jcc.10128
- kind: doi
  text: >-
    Wang, Wolf, Caldwell, Kollman, Case, J. Comput. Chem. 25, 1157 (2004) — the general Amber force
    field (GAFF). doi:10.1002/jcc.20035
  locator: doi:10.1002/jcc.20035
pitfalls:
- LIGAND_HYDROGENS_ABSENT
- COMPLEX_RESTRAINTS_OUT_OF_RANGE
- NDX_COMMAND_REJECTED
validated_by:
- >-
  tests/unit/test_gromacs_tools.py::test_a_ligand_is_parametrised_and_placed_where_grompp_reads_it
notes: >-
  The tutorial parametrises its ligand with CGenFF for CHARMM36; this sequence keeps its shape and
  system and takes the Amber route (GAFF2, AM1-BCC), so the ligand and the protein share one combination
  rule and fudge factors. The complex is built before the mandate is written (the complex-prep skill:
  the chain and the ligand selected, the ligand parametrised through acpype, assembled, boxed, solvated,
  neutralised, indexed), and what that made is the system it names.
version: 6
