id: fm_reference_singlepoint
system_class: frames of any QM/MM system whose QM region the CPMD input set's class covers
title: QM/MM reference forces for force matching — the single-point pipeline
scope: engine
applicability: 'Generate the reference force set a force-matching fit is trained against: render the
  CPMD and GROMACS halves, then one coupled run over the sampled frames. Start from it when you have
  frames and want QM forces for them.'
given:
- structure
- topology
- frames
steps:
- name: cpmd_input
  tool: mimic_prepare
  cites: inputset:fm_singlepoint_cpmd@v1
  needs:
  - structure
  - topology
  produces:
  - cpmd_input
  - index_qm
- name: mm_mdp
  tool: gmx_grompp
  cites: inputset:fm_singlepoint_mm@v1
  needs:
  - structure
  - topology
  - index_qm
  produces:
  - tpr_fm
- name: reference_run
  tool: mimic_run
  needs:
  - tpr_fm
  - cpmd_input
  - frames
  produces:
  - reference_forces
  - trajectory_mm
invariants:
- id: FM_PACE_MATCHES_NSTXOUT
  equal:
  - $mm_mdp.nstxout
  - $cpmd_input.&CPMD/FORCE_MATCHING
  message: 'the GROMACS output pace must equal the CPMD FORCE_MATCHING pace: CPMD writes one reference-force
    record per pace step and the fit pairs it with the GROMACS frame of the same index, so a mismatch
    silently pairs QM forces with the wrong geometry'
sources:
- kind: in_house
  text: 'The acetone force-matching reference pair generated through the harness with MiMiC-enabled
    CPMD and GROMACS on a SLURM cluster. Inputs kept verbatim in tests/fixtures/acetone/ as
    fm_singlepoint_template.inp and mimic_fm.mdp; the pace/nstxout rule is stated in that mdp''s
    own comments.

    '
  locator: tests/fixtures/acetone/fm_singlepoint_template.inp
  evidence:
  - tests/fixtures/acetone/mimic_fm.mdp
- kind: tutorial
  text: 'Everything not changed here is inherited from the acetone tutorial input sets, which are distilled
    from the MiMiC project''s acetone-in-water tutorial.

    '
  locator: inputset:mimic_cpmd_template
pitfalls:
- CPMD_MULTIPLICITY_WITHOUT_LSD
- FM_RERUN_MDP_IS_MIMIC
validated_by:
- src/myrmidon/knowledge/protocols.py (a protocol that cannot run in its own order is refused at load)
notes: The sequence is knowledge; a study's plan is one instance of it. The classical rerun the fit
  subtracts is a different mdp — see the fm_classical_rerun input set.
version: 1
