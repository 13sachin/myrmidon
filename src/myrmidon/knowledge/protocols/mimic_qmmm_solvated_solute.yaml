id: mimic_qmmm_solvated_solute
system_class: >-
  a solute treated quantum-mechanically in a classical water box, closed-shell, light elements; distilled
  from a box of about 1500 atoms with a 10-atom QM region
aliases:
- mimic_qmmm_acetone
title: MiMiC QM/MM of a small solute in water — the MiMiC project's pipeline
scope: engine
applicability: >-
  The reference MiMiC QM/MM sequence: minimise and equilibrate classically, then four coupled stages
  — anneal, check NVE, heat, produce. Start from it for a small solute treated quantum-mechanically
  in a classical box. It is a starting point and not a rule: bring an equilibrated box and drop the
  first two stages, or build a different sequence entirely — that is what experimenting is.
given:
- structure
- topology
hamiltonian:
  qm:
    method: blyp_mt
  coupling:
    scheme: mimic
stages:
- name: minimise
  kind: minimize
- name: equilibrate
  kind: dynamics
  ensemble: NPT
  temperature_k: 300
  pressure_bar: 1
  duration_ps: 200
- name: anneal
  kind: minimize
  regime: qmmm
  steps: 300
  temperature_k: 300
  qm_region:
    subsystems:
    - ligand
    charge: 0
    multiplicity: 1
- name: nve_check
  kind: dynamics
  regime: qmmm
  starts_from: anneal
  ensemble: NVE
  steps: 1000
  qm_region:
    subsystems:
    - ligand
    charge: 0
    multiplicity: 1
- name: heat
  kind: dynamics
  regime: qmmm
  ensemble: NVT
  steps: 1500
  starts_from: anneal
  temperature_k:
    to_k: 300
  qm_region:
    subsystems:
    - ligand
    charge: 0
    multiplicity: 1
- name: production
  kind: dynamics
  regime: qmmm
  ensemble: NVT
  steps: 1000
  temperature_k: 300
  qm_region:
    subsystems:
    - ligand
    charge: 0
    multiplicity: 1
deliverables:
- name: nve_drift
  property: energy_drift
  over: nve_check
- name: heating_temperature
  property: thermodynamics
  over: heat
  statistics:
  - final
- name: production_temperature
  property: thermodynamics
  over: production
  statistics:
  - mean
  - sd
- name: production_dipole
  property: dipole
  over: production
  statistics:
  - mean
invariants:
- id: DYNAMICS_TIMESTEP_IS_THE_CPMD_ONE
  not_equal:
  - $anneal.dt
  - $production.&CPMD/TIMESTEP
  message: >-
    the GROMACS dt and the CPMD TIMESTEP are in different units and are not the same number; the mdp
    dt is inert in a MiMiC run and the CPMD one is what advances time
sources:
- kind: tutorial
  text: >
    MiMiC acetone-in-water tutorial, the input archive published by the MiMiC project. Downloaded
    with the command the tutorial gives; template.inp, mini.mdp, heat.mdp, mimic.mdp, sele.dat and
    pp_info.dat are copied verbatim into tests/fixtures/mimic_tutorial/. sha256 is of template.inp.
  locator: https://gitlab.com/mimic-project/mimic-docs/-/tree/main/docs/tutorials/AcetoneTutorial
  sha256: 51e3952370e541dac4f2da20dd526cceba4aa016117daa62878bb73dbe425440
- kind: url
  text: >
    The tutorial page itself, which prints the per-stage &CPMD blocks the reader edits the template
    into. The archive ships the template only, so the four dynamics stages cite the page.
  locator: https://mimic-project.org/en/latest/tutorials/acetone_tutorial.html
pitfalls: []
validated_by:
- >-
  src/myrmidon/knowledge/protocols.py (a protocol whose stages do not hold together as a mandate's
  method is refused at load)
notes: >-
  Distilled from the eight stages of the MiMiC project's acetone-in-water tutorial: the sequence is
  knowledge, one study's instance of it is not. It starts from a solvated box (the skills build one:
  its cell, its solute-to-box clearance and its solvent are the build's), minimises and equilibrates
  it classically, then runs four coupled stages: anneal, an NVE check of energy conservation, heat,
  produce. Which atoms are quantum is each coupled stage's qm_region and the researcher's; every value
  a stage's files hold is compiled from its physical terms, its template and the methods the hamiltonian
  names.
version: 9
