# What a careful researcher notices in a CPMD input for a MiMiC coupled run, before it is
# submitted. Read over the input's facts (cpmd_input.cpmd_subject: the &MIMIC BOX, the QM
# cell's vacuum around the QM atoms, RESTART, restraints, MAXSTEP and the run type, and the
# restart a call names) and, `each: key`, over every keyword line as the CPMD version's
# catalog describes it.
sensors:
  - id: CPMD_KEYWORD_UNKNOWN
    subject: cpmd_input
    engine: cpmd
    each: key
    when: {status: unknown}
    sees: "&{section} {line}: CPMD {version} reads no such keyword"
    means: "CPMD lists it among the unknown keywords and runs without it"
    usual_move: "check the spelling and the section against the CPMD manual"
    status: verified
    sources:
      - kind: engine_manual
        text: CPMD manual, the input file's keywords by section
        locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex

  - id: CPMD_KEYWORD_OUT_OF_SCOPE
    subject: cpmd_input
    engine: cpmd
    each: key
    when: {status: out_of_scope}
    sees: "&{section} {line}: no stage template or input set states this keyword"
    means: "nothing the harness ships reasons about it, so its effect is the file's alone"
    usual_move: "leave {name} out unless the study is about it"
    status: verified
    sources:
      - kind: engine_manual
        text: CPMD manual
        locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex

  - id: MIMIC_BOX_MISSING
    subject: cpmd_input
    engine: cpmd
    when: {has_mimic_section: true, has_mimic_box: false}
    sees: "&MIMIC has no BOX line"
    means: "the whole system's box is how MiMiC places the QM cell in the MM box"
    usual_move: "let mimic_prepare write &MIMIC from the system"
    status: verified
    sources:
      - kind: engine_manual
        text: GROMACS 2021.6 reference manual, MiMiC hybrid QM/MM
        locator: https://manual.gromacs.org/2021.6/reference-manual/special/mimic-qmmm.html

  - id: QM_CELL_NO_VACUUM
    subject: cpmd_input
    engine: cpmd
    when: {min_vacuum_bohr: {lt: 1.0}}
    sees: "QM cell {cell_bohr} bohr leaves {min_vacuum_bohr} bohr around the QM atoms"
    means: "with no vacuum around the QM region CPMD/MiMiC segfaults in the short-range potential, and says nothing that names the cause"
    usual_move: "qm_region with padding_nm >= 0.3"
    stops_the_call: true
    status: verified
    sources:
      - kind: engine_output
        text: a coupled run whose QM cell was the QM atoms' bounding box, segfaulting in the short-range potential
        locator: tests/fixtures/cpmd/segfault_tight_cell.err
        sha256: 036585f9a7d207fd68797a274712f1272efc8fd2b1a206bcb6b4dc0ff5228283

  - id: QM_CELL_TIGHT
    subject: cpmd_input
    engine: cpmd
    when: {min_vacuum_bohr: {ge: 1.0, lt: 5.0}}
    sees: "only {min_vacuum_bohr} bohr between the QM atoms and the cell wall (cell {cell_bohr} bohr)"
    means: "the electron density touches the wall; the isolated-molecule Poisson solver needs several bohr of vacuum"
    usual_move: "padding_nm >= 0.3 in qm_region"
    status: verified
    sources:
      - kind: engine_manual
        text: CPMD manual, POISSON SOLVER and isolated systems
        locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex#system-poisson-solver

  - id: CPMD_RESTART_FILE_UNUSED
    subject: cpmd_input
    engine: cpmd
    when: {restart_from: {not: [null]}, wants_restart: false}
    sees: "restart_from names {restart_from}, and the input has no RESTART line"
    means: "CPMD starts from scratch and ignores the file: the run is not the continuation it looks like"
    usual_move: "render the input with RESTART (the continuation stages carry it), or drop restart_from"
    status: verified
    sources:
      - kind: engine_manual
        text: CPMD manual, RESTART
        locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex#cpmd-restart

  - id: CPMD_RESTRAINTS_UNDER_MIMIC
    subject: cpmd_input
    engine: cpmd
    when: {has_restraints: true}
    sees: "&ATOMS carries a CONSTRAINTS/RESTRAINTS block"
    means: "in MiMiC coupled runs CPMD's native restraints have segfaulted when the restraint force is first applied, in builds without PLUMED hooks"
    usual_move: "displaced single points for geometries at chosen distances, unless the build is known to support restraints under MiMiC"
    status: candidate
    sources:
      - kind: engine_manual
        text: CPMD manual, CONSTRAINTS and RESTRAINTS in &ATOMS
        locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex

  - id: CPMD_MAXSTEP_UNSET
    subject: cpmd_input
    engine: cpmd
    when: {maxstep: null, optimising: false}
    sees: "&CPMD has no MAXSTEP, and the run is dynamics"
    means: "CPMD runs its compiled default number of MD steps: the stage's length is not on record"
    assumption: "CPMD's compiled default number of MD steps"
    usual_move: "maxsteps in mimic_prepare: the number of MD steps this stage runs"
    status: verified
    sources:
      - kind: engine_manual
        text: CPMD manual, MAXSTEP
        locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex#cpmd-maxstep

  - id: CPMD_SCF_LIMIT_TOO_LOW
    subject: cpmd_input
    engine: cpmd
    when: {optimising: true, maxstep: {lt: 20}}
    sees: "a WAVEFUNCTION OPTIMIZATION run with MAXSTEP {maxstep}"
    means: "MAXSTEP bounds SCF iterations here; an unconverged single point still exits 0, and its forces are unusable as reference data"
    usual_move: "leave maxsteps unset so CPMD uses its own SCF limit"
    status: verified
    sources:
      - kind: engine_manual
        text: CPMD manual, MAXSTEP under WAVEFUNCTION OPTIMIZATION
        locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex#cpmd-maxstep

  - id: PP_LMAX_ALL_S_ON_HEAVY_ATOMS
    subject: qm_region
    engine: cpmd
    when: {heavy_lmax_s: {not: null}}
    sees: "the QM region's {heavy_lmax_s} carry LMAX=S"
    means: "prepqm gives every species LMAX=S when no pseudopotential table names its channels; a non-hydrogen atom needs its p channel (a norm-conserving Troullier-Martins C, N or O is LMAX=P), or CPMD computes its nonlocal term with too few projectors and says nothing"
    usual_move: "pp_info naming each element's file and LMAX, and select the region again"
    status: verified
    sources:
      - kind: engine_output
        text: real prepqm on a topology, no -pp, every species written LMAX=S
        locator: tests/fixtures/mimicpy/prepqm_acetone.inp

  - id: QM_MULTIPLICITY_PARITY
    subject: qm_region
    engine: cpmd
    when: {spin_parity_matches: false}
    sees: "multiplicity {multiplicity} for {electrons} electrons (all-electron count)"
    means: "a multiplicity of 2S+1 needs 2S unpaired electrons: an even count cannot be a doublet, an odd one cannot be a singlet; CPMD would run a state the region cannot have"
    usual_move: "check the QM region's charge and the multiplicity against its electrons"
    status: verified
    sources:
      - kind: engine_manual
        text: CPMD manual, MULTIPLICITY
        locator: https://gitlab.com/mimic-project/cpmd/-/tree/72922c3/doc/manual/manual.tex#system-multiplicity
