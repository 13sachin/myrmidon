id: qm.blyp_mt
axis: method
engine: cpmd
renders: cpmd_inp
title: BLYP with Troullier-Martins pseudopotentials at 70 Ry, MiMiC-coupled
system_class: a closed-shell QM region of light elements (H, C, N, O) treated with BLYP and Troullier-Martins
  pseudopotentials at 70 Ry, a few tens of atoms; an open-shell region needs LSD and a multiplicity,
  a metal or heavier elements a different cutoff and pseudopotentials
scope: engine
applicability: 'How the QM subsystem of a MiMiC run is computed and coupled: BLYP through libxc, Troullier-Martins
  pseudopotentials at a 70 Ry plane-wave cutoff, an isolated QM cell, and the MiMiC electrostatic
  coupling. Every coupled stage (annealing, NVE check, heating, production, a force-matching single
  point) takes these; rendered alone it is the template prepqm writes the system into.'
parameters:
  '&MIMIC/LONG-RANGE COUPLING':
    value: true
    source: 0
  '&MIMIC/FRAGMENT SORTING ATOM-WISE UPDATE':
    value: 100
    source: 1
  '&MIMIC/CUTOFF DISTANCE':
    value: 20.0
    rationale: bohr; beyond it the MM charges enter as multipoles. Right for a QM region of a few
      tens of atoms; a larger region needs it beyond its own extent (mimic_select_qm's qm_extent_bohr)
      plus the first solvation shells
    source: 1
  '&MIMIC/MULTIPOLE ORDER':
    value: 3
    source: 1
  '&CPMD/MIMIC':
    value: true
    source: 2
  '&CPMD/NEW CONSTRAINTS':
    value: true
    source: 1
  '&CPMD/ISOLATED MOLECULE':
    value: true
    rationale: the QM cell is not periodic; the MM box is
    source: 1
  '&SYSTEM/POISSON SOLVER TUCKERMAN':
    value: true
    rationale: isolated-system electrostatics for the QM cell
    source: 3
  '&SYSTEM/SYMMETRY':
    value: 0
    source: 1
  '&SYSTEM/CUTOFF':
    value: '70.'
    rationale: Ry plane-wave cutoff, converged for MT BLYP pseudopotentials
    source: 4
  '&DFT/XC_DRIVER':
    value: true
    rationale: libxc, so the functional name is the libxc one
    source: 1
  '&DFT/FUNCTIONAL GGA_XC_BLYP':
    value: true
    source: 5
sources:
- kind: doi
  text: Olsen, Bolnykh, Meloni, Ippoliti, Bircher, Carloni, Rothlisberger, J. Chem. Theory Comput.
    15, 3810 (2019) — MiMiC, the multiscale coupling framework. doi:10.1021/acs.jctc.9b00093
  locator: doi:10.1021/acs.jctc.9b00093
- kind: tutorial
  text: 'MiMiC acetone-in-water tutorial, the input archive published by the MiMiC project. Downloaded
    with the command the tutorial gives; template.inp, mini.mdp, heat.mdp, mimic.mdp, sele.dat and
    pp_info.dat are copied verbatim into tests/fixtures/mimic_tutorial/. sha256 is of template.inp.

    '
  locator: https://gitlab.com/mimic-project/mimic-docs/-/tree/main/docs/tutorials/AcetoneTutorial
  sha256: 51e3952370e541dac4f2da20dd526cceba4aa016117daa62878bb73dbe425440
- kind: url
  text: 'The tutorial page itself, which prints the per-stage &CPMD blocks the reader edits the template
    into. The archive ships the template only, so the four dynamics stages cite the page.

    '
  locator: https://mimic-project.org/en/latest/tutorials/acetone_tutorial.html
- kind: doi
  text: Martyna, Tuckerman, J. Chem. Phys. 110, 2810 (1999) — reciprocal-space Poisson solver for
    isolated systems. doi:10.1063/1.477923
  locator: doi:10.1063/1.477923
- kind: doi
  text: Troullier, Martins, Phys. Rev. B 43, 1993 (1991) — efficient norm-conserving pseudopotentials.
    doi:10.1103/PhysRevB.43.1993
  locator: doi:10.1103/PhysRevB.43.1993
- kind: doi
  text: Becke, Phys. Rev. A 38, 3098 (1988) and Lee, Yang, Parr, Phys. Rev. B 37, 785 (1988) — the
    BLYP exchange-correlation functional. doi:10.1103/PhysRevA.38.3098
  locator: doi:10.1103/PhysRevA.38.3098
pitfalls:
- QM_ELEMENT_NOT_COVERED
notes: 'A method set supplies how the QM subsystem is computed, never the system: &MIMIC PATHS, BOX
  and OVERLAPS, the QM cell and the whole &ATOMS block are written per system by mimicpy''s prepqm,
  and &SYSTEM CHARGE is chemistry, which mimic_prepare requires confirmed. Its pseudopotentials are
  the library''s *_MT_BLYP files; an element without one is refused before a run is submitted (QM_ELEMENT_NOT_COVERED).'
version: 1
